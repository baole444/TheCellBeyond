name: Distribute Release Executable
on:
  push:
    tags:
      - 'v*'
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            label: windows
          - os: ubuntu-latest
            label: linux
          - os: macos-latest
            label: macos-arm64
          - os: macos-13
            label: macos-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Make gradlew executable
        if: runner.os != 'Window'
        run: chmod +x gradlew
      - name: Build engine exe
        run: ./gradlew packageApp
      - name: Zip to bundle
        shell: bash
        run: |
          cd build/packaging/output
          if [ "${{ matrix.label }}" = "windows" ]; then
            7z a -tzip "../TheCellBeyond-${{ matrix.label }}.zip" TheCellBeyond/
          else
            zip -r "../TheCellBeyond-${{ matrix.label }}.zip" TheCellBeyond/
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TheCellBeyond-${{ matrix.label }}
          path: build/packaging/TheCellBeyond-${{ matrix.label }}.zip
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          generate_release_notes: true