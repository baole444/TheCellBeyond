name: Distribute Release Executable
on:
  push:
    tags:
      - 'v*'
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            label: windows
          - os: ubuntu-latest
            label: linux
          - os: macos-latest
            label: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Generate icns icon on MacOS
        if: runner.os == 'macOS'
        run: |
          ICON="src/main/resources/assets/textures/TCB icon"
          mkdir -p icon.iconset
          sips -z 16 16     "$ICON.png" --out icon.iconset/icon_16x16.png
          sips -z 32 32     "$ICON.png" --out icon.iconset/icon_16x16@2x.png
          sips -z 32 32     "$ICON.png" --out icon.iconset/icon_32x32.png
          sips -z 64 64     "$ICON.png" --out icon.iconset/icon_32x32@2x.png
          sips -z 128 128   "$ICON.png" --out icon.iconset/icon_128x128.png
          sips -z 256 256   "$ICON.png" --out icon.iconset/icon_128x128@2x.png
          sips -z 256 256   "$ICON.png" --out icon.iconset/icon_256x256.png
          sips -z 512 512   "$ICON.png" --out icon.iconset/icon_256x256@2x.png
          sips -z 512 512   "$ICON.png" --out icon.iconset/icon_512x512.png
          sips -z 1024 1024 "$ICON.png" --out icon.iconset/icon_512x512@2x.png
          iconutil -c icns icon.iconset -o "$ICON.icns"
      - name: Make gradlew executable
        if: runner.os != 'Windows'
        run: chmod +x gradlew
      - name: Build engine executable
        shell: bash
        run: ./gradlew packageApp
      - name: Zip to bundle
        shell: bash
        run: |
          cd build/packaging/output
          if [ "${{ matrix.label }}" = "windows" ]; then
            7z a -tzip "../TheCellBeyond-${{ matrix.label }}.zip" TheCellBeyond*/
          else
            zip -r "../TheCellBeyond-${{ matrix.label }}.zip" TheCellBeyond*/
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: TheCellBeyond-${{ matrix.label }}
          path: build/packaging/TheCellBeyond-${{ matrix.label }}.zip
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          generate_release_notes: true
