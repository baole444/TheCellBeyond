sheet: "wheel" #the key of the sheet in project file
#
# Animation states (animations for short) hold sprite animation sequence,
# which will be played when a state is triggered.
#
animations:
  left: #title of animation
    loop: false #set loop status
    sequence: # order of sprite for this animation to be add
      - 0
      - 1
  right:
    loop: false
    sequence:
      - 1
      - 0
  up:
    loop: false
    sequence:
      - 3
      - 4
  down:
    loop: false
    sequence:
      - 5
      - 6
  idle:
    loop: true
    sequence:
      - 7
      - 0
#
# Conditions are set of rule dictate valid state to switch from and to.
# There can be multiple source state to switch from.
# There can only be one state to switch to for each condition.
#
conditions:
  default: "idle" #default state, must be an existing animation state from above
  move_up: #name of  the condition, customizable
    from: #list of current states that are valid to switch from.
      - "idle"
      - "down"
      - "left"
      - "right"
    to: "up" #the state to switch to, can only be one.
  move_down:
    from:
      - "idle"
      - "up"
      - "left"
      - "right"
    to: "down"
  move_left:
    from:
      - "idle"
      - "up"
      - "down"
      - "right"
    to: "left"
  move_right:
    from:
      - "idle"
      - "up"
      - "down"
      - "left"
    to: "right"
  reset_move:
    from:
      - "up"
      - "down"
      - "left"
      - "right"
    to: "idle"
#
# More conditions can be added.
#
#