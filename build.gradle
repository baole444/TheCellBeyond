import org.gradle.internal.os.OperatingSystem

plugins {
    id 'java'
    id 'maven-publish'
    id 'signing'
}

group = project.project_group
version = project.TCB_version

int targetJavaVersion = 25

switch (OperatingSystem.current()) {
    case OperatingSystem.LINUX:
        project.ext.lwjglNatives = lwjgl_linux
        project.ext.imguiNatives = imgui_linux
        def osArch = System.getProperty("os.arch")
        if (osArch.startsWith("arm") || osArch.startsWith("aarch64")) {
            project.ext.lwjglNatives += osArch.contains("64") || osArch.startsWith("armv8") ? "-arm64" : "-arm32"
        } else if (osArch.startsWith("ppc")) {
            project.ext.lwjglNatives += "-ppc64le"
        } else if (osArch.startsWith("riscv")) {
            project.ext.lwjglNatives += "-riscv64"
        }
        break
    case OperatingSystem.MAC_OS:
        project.ext.lwjglNatives = System.getProperty("os.arch").startsWith("aarch64") ? lwjgl_macos_arm64 : lwjgl_macos
        project.ext.imguiNatives = imgui_macos
        break
    case OperatingSystem.WINDOWS:
        project.ext.lwjglNatives = lwjgl_window
        project.ext.imguiNatives = imgui_window
        break
}

repositories {
    flatDir {
        dirs 'library'
    }

    mavenCentral()
}

test {
    useJUnitPlatform()
}

dependencies {
    implementation "com.google.code.gson:gson:$google_gson_version"
    implementation fileTree('library') { include '*.jar' }
    implementation ":jbox2d-library"

    // LWJGL
    implementation platform("org.lwjgl:lwjgl-bom:$lwjgl_version")

    ['', '-assimp', '-glfw', '-nfd', '-openal', '-opengl', '-stb', '-msdfgen', '-freetype'].each {
        implementation "org.lwjgl:lwjgl$it"
        implementation "org.lwjgl:lwjgl$it::$project.ext.lwjglNatives"
    }

    implementation "org.joml:joml:${joml_version}"
    implementation "com.code-disaster.steamworks4j:steamworks4j:${steamworks4j_version}"
    implementation "tools.jackson.dataformat:jackson-dataformat-yaml:$jacksonYaml_version"

    // SpaiR-imgui
    implementation "io.github.spair:imgui-java-binding:$imgui_version"
    implementation "io.github.spair:imgui-java-lwjgl3:$imgui_version"
    implementation "io.github.spair:imgui-java-$project.ext.imguiNatives:$imgui_version"

    // Test unit
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

tasks.withType(Javadoc).configureEach {
    it.options.encoding = "UTF-8"
    it.options {
        tags = [
                "apiNote:a:API Note:",
                "implSpec:a:Implementation Requirements:",
                "implNote:a:Implementation Note:"
        ]
        source = "25"
    }
    if (targetJavaVersion >= 18) {
        it.options.addStringOption('-snippet-path', 'src/snippet-files')
    }
}

// Engine Executable packaging
jar {
    manifest {
        attributes(
                'Main-Class': 'TheCellBeyond.Main',
                'Class-Path': configurations.runtimeClasspath.files
                .collect { 'libs/' + it.name }.join(' ')
        )
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.register('collectDeps', Copy) {
    group = 'distribution'
    description = 'Collect all runtime dependencies into a single directory'
    from configurations.runtimeClasspath
    into layout.buildDirectory.dir('packaging/libs')
}

tasks.register('packageInput', Copy) {
    group = 'distribution'
    description = 'Prepare input directory for jpackage'
    dependsOn clean, jar, collectDeps
    mustRunAfter clean
    from (jar.archiveFile) { into '.' }
    from (layout.buildDirectory.dir('packaging/libs')) { into 'libs' }
    into layout.buildDirectory.dir('packaging/input')
}

tasks.register('resolveModules', Exec) {
    group = 'distribution'
    description = 'Resolve required JRE modules with jdeps'
    dependsOn packageInput
    def inputDir = layout.buildDirectory.dir('packaging/input')
    def modulesFile = layout.buildDirectory.file('packaging/modules.txt')
    doFirst {
        def jarFile = fileTree(inputDir).matching { include '*.jar' }.singleFile
        def libsDir = file("${inputDir.get().asFile}/libs")
        standardOutput = new ByteArrayOutputStream()
        commandLine 'jdeps',
                '--multi-release', 'base',
                '--print-module-deps',
                '--ignore-missing-deps',
                '-cp', "${libsDir.absolutePath}/*",
                jarFile.absolutePath
    }
    doLast {
        def modules = standardOutput.toString().trim()
        modulesFile.get().asFile.text = modules
        logger.lifecycle("Required JRE modules: ${modules}")
    }
}

tasks.register('jlinkRuntime', Exec) {
    group = 'distribution'
    description = 'Create JRE for distribution'
    dependsOn resolveModules
    def runtimeDir = layout.buildDirectory.dir('packaging/runtime')
    def modulesFile = layout.buildDirectory.file('packaging/modules.txt')
    doFirst {
        delete runtimeDir
        def modules = modulesFile.get().asFile.text.trim()
        commandLine 'jlink',
                '--add-modules', modules,
                '--output', runtimeDir.get().asFile.absolutePath,
                '--strip-debug',
                '--no-man-pages',
                '--no-header-files',
                '--compress', 'zip-6'
    }
}

tasks.register('packageApp', Exec) {
    group = 'distribution'
    description = 'Create native application image with jpackage'
    dependsOn packageInput, jlinkRuntime
    def inputDir = layout.buildDirectory.dir('packaging/input')
    def outputDir = layout.buildDirectory.dir('packaging/output')
    def runtimeDir = layout.buildDirectory.dir('packaging/runtime')
    def jarName = jar.archiveFileName.get()
    def iconExt = OperatingSystem.current().windows ? 'ico' : OperatingSystem.current().macOsX ? 'icns' : 'png'
    def iconFile = file("src/main/resources/assets/textures/TCB icon.${iconExt}")
    def args = [
            'jpackage',
            '--input', inputDir.get().asFile.absolutePath,
            '--dest', outputDir.get().asFile.absolutePath,
            '--name', 'TheCellBeyond_v' + version,
            '--main-jar', jarName,
            '--main-class', 'TheCellBeyond.Main',
            '--type', 'app-image',
            '--runtime-image', runtimeDir.get().asFile.absolutePath,
            '--java-options', '--enable-native-access=ALL-UNNAMED',
    ]
    if (iconFile.exists()) args += ['--icon', iconFile.absolutePath]
    commandLine args
}

// Engine Scripting API
// Packages and classes exposed to script authors via the API jar.
// Add entries when new API are introduced.

// Include a class and their inner classes
def cls = { String path -> ["${path}.class", "${path}\$*.class"] }
def TCB = 'TheCellBeyond/'
def TCBClasses = [
        'GameObject', 'GameObject2D', 'Camera2D', 'TileMap', 'Parallax2D',
        'Transform2D', 'Viewport', 'RenderableObject', 'Sound',
        'AudioResourceType', 'KeyListener', 'MouseListener',
]
def TCBInternals = ['LogicServer', 'ResourceID', 'ResourceStatus', 'ResourceStatusCallback']
def InputClasses = ['Input', 'InputAction', 'InputKey', 'InputType']
def UTL = 'utility/'
def UtilityClasses = [
        'AssetManager', 'AssetResourceType', 'AssetReference', 'UnifiedPaths',
        'HierarchyPath', 'HierarchyPaths', 'WorldUnit', 'Settings',
        'TCBMath', 'TextureScale', 'FontPT', 'IdPool', 'RingBuffer'
]
def SPT = 'scripting/'
def ScriptingClasses = ['RegisterComponent', 'RegisterGameObject', 'TypeEntry']

ext.apiIncludes = [
        // Core classes
        TCBClasses.collect { cls(TCB + it) },

        // Scene and LogicServer
        TCBInternals.collect { cls(TCB + 'internal/' + it) },
        cls('scene/Scene'),
        cls('scene/SceneLoader'),

        // InputAction
        InputClasses.collect { cls(TCB + it) },

        // Render
        'render/commands/**',
        'render/texture/**',
        cls('render/Renderable'),
        cls('render/FrameBuffer'),
        'render/text/HorizontalAlignment.class',
        'render/text/VerticalAlignment.class',
        cls('render/text/TCBFont'),

        // All components
        'components/**',

        // All physic
        'physic2d/**',

        // Signal
        cls('signal/Signal'),
        cls('signal/Callable'),

        // Event Viewer
        cls('eventviewer/EngineEventCallback'),
        cls('eventviewer/event/SceneEvent'),
        cls('eventviewer/event/Event'),

        // Project
        cls('project/Project'),
        cls('project/ProjectPreference'),

        // Serialization
        cls('serialization/EngineSerializer'),

        // Script annotations
        ScriptingClasses.collect { cls(SPT + it) },

        // Utils
        UtilityClasses.collect { cls(UTL + it) },
        UTL + 'log/**'
].flatten()

def TCB_API = 'thecellbeyond-api'

tasks.register('apiJar', Jar) {
    group = 'build'
    description = 'Build the engine API jar for compiled classes'
    archiveBaseName = TCB_API
    dependsOn compileJava
    from(sourceSets.main.output.classesDirs) {
        includes = apiIncludes
    }
}

tasks.register('apiSourcesJar', Jar) {
    group = 'build'
    description = 'Package API sources for Maven Central publication'
    archiveBaseName = TCB_API
    archiveClassifier = 'sources'
    from(sourceSets.main.java.srcDirs) {
        includes = apiIncludes.collect { it.replace('.class', '.java').replace('$*', '') }
    }
}

tasks.register('apiJavadoc', Javadoc) {
    group = 'documentation'
    description = 'Generates Javadoc for engine API classes'
    dependsOn compileJava
    source = sourceSets.main.java
    classpath = sourceSets.main.compileClasspath + sourceSets.main.output
    include apiIncludes.collect { it.replace('.class', '.java').replace('$*', '') }
    failOnError = false
    options.encoding = "UTF-8"
    options {
        tags = [
                "apiNote:a:API Note:",
                "implSpec:a:Implementation Requirements:",
                "implNote:a:Implementation Note:"
        ]
        source = "25"
    }
}

tasks.register('apiJavadocJar', Jar) {
    group = 'build'
    description = 'Package API Javadoc for Maven Central publication'
    archiveBaseName = TCB_API
    archiveClassifier = 'javadoc'
    dependsOn apiJavadoc
    from apiJavadoc.destinationDir
}

publishing {
    publications {
        engineApi(MavenPublication) {
            artifactId = TCB_API
            artifact apiJar
            artifact apiSourcesJar
            artifact apiJavadocJar
            pom {
                name = 'TheCellBeyond API'
                description = 'Scripting API for TheCellBeyond game engine'
                url = 'https://github.com/baole444/TheCellBeyond'
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }
                developers {
                    developer {
                        id = 'baole444'
                        name = 'baole444'
                    }
                }
                scm {
                    connection = 'scm:git:git://github.com/baole444/TheCellBeyond.git'
                    developerConnection = 'scm:git:ssh://github.com/baole444/TheCellBeyond.git'
                    url = 'https://github.com/baole444/TheCellBeyond'
                }
                withXml {
                    def deps = asNode().appendNode('dependencies')
                    def joml = deps.appendNode('dependency')
                    joml.appendNode('groupId', 'org.joml')
                    joml.appendNode('artifactId', 'joml')
                    joml.appendNode('version', joml_version)
                    joml.appendNode('scope', 'compile')
                }
            }
        }
    }
    repositories {
        maven {
            name = 'LocalStaging'
            url = uri(layout.buildDirectory.dir('staging-deploy'))
        }
    }
}

signing {
    required = findProperty('signing.keyId') != null
    sign publishing.publications.engineApi
}

tasks.register('publishToCentral', Exec) {
    group = 'publishing'
    description = 'Uploads the API bundle to Maven Central'
    dependsOn 'publishEngineApiPublicationToLocalStagingRepository'

    def stagingDir = layout.buildDirectory.dir('staging-deploy')
    def bundleFile = layout.buildDirectory.file('thecellbeyond-api-bundle.zip')

    doFirst {
        ant.zip(destfile: bundleFile.get().asFile) {
            fileset(dir: stagingDir.get().asFile)
        }

        def tokenUser = findProperty('centralPortalUsername') ?: ''
        def tokenPass = findProperty('centralPortalPassword') ?: ''
        def token = Base64.encoder.encodeToString("${tokenUser}:${tokenPass}".bytes)

        commandLine 'curl', '--fail', '--request', 'POST',
                '--header', "Authorization: Bearer ${token}",
                '--form', "bundle=@${bundleFile.get().asFile.absolutePath}",
                'https://central.sonatype.com/api/v1/publisher/upload?publishingType=AUTOMATIC'
    }
}