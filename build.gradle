import org.gradle.internal.os.OperatingSystem

plugins {
    id 'java'
}

group = project.project_group
version = project.TCB_version

int targetJavaVersion = 25

switch (OperatingSystem.current()) {
    case OperatingSystem.LINUX:
        project.ext.lwjglNatives = lwjgl_linux
        project.ext.imguiNatives = imgui_linux
        def osArch = System.getProperty("os.arch")
        if (osArch.startsWith("arm") || osArch.startsWith("aarch64")) {
            project.ext.lwjglNatives += osArch.contains("64") || osArch.startsWith("armv8") ? "-arm64" : "-arm32"
        } else if (osArch.startsWith("ppc")) {
            project.ext.lwjglNatives += "-ppc64le"
        } else if (osArch.startsWith("riscv")) {
            project.ext.lwjglNatives += "-riscv64"
        }
        break
    case OperatingSystem.WINDOWS:
        project.ext.lwjglNatives = lwjgl_window
        project.ext.imguiNatives = imgui_window
}

repositories {
    flatDir {
        dirs 'library'
    }

    mavenCentral()
}

test {
    useJUnitPlatform()
}

dependencies {
    implementation "com.google.code.gson:gson:$google_gson_version"
    implementation fileTree('library') { include '*.jar' }
    implementation ":jbox2d-library"

    // LWJGL
    implementation platform("org.lwjgl:lwjgl-bom:$lwjgl_version")

    ['', '-assimp', '-glfw', '-nfd', '-openal', '-opengl', '-stb', '-msdfgen', '-freetype'].each {
        implementation "org.lwjgl:lwjgl$it"
        implementation "org.lwjgl:lwjgl$it::$project.ext.lwjglNatives"
    }

    implementation "org.joml:joml:${joml_version}"
    implementation "com.code-disaster.steamworks4j:steamworks4j:${steamworks4j_version}"
    implementation "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:$jacksonYaml_version"

    // SpaiR-imgui
    implementation "io.github.spair:imgui-java-binding:$imgui_version"
    implementation "io.github.spair:imgui-java-lwjgl3:$imgui_version"
    implementation "io.github.spair:imgui-java-$project.ext.imguiNatives:$imgui_version"

    // Test unit
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

tasks.withType(Javadoc).configureEach {
    it.options.encoding = "UTF-8"
    it.options {
        tags = [
                "apiNote:a:API Note:",
                "implSpec:a:Implementation Requirements:",
                "implNote:a:Implementation Note:"
        ]
        source = "25"
    }
    if (targetJavaVersion >= 18) {
        it.options.addStringOption('-snippet-path', 'src/snippet-files')
    }
}